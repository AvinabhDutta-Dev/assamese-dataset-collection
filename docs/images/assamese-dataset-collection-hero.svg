<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="700" viewBox="0 0 2200 700" role="img" aria-labelledby="title desc">
  <title id="title">Assamese Dataset Collection Scripts</title>
  <desc id="desc">A conceptual workflow showing reference scripts for IMDb, Reddit, and YouTube feeding raw CSV files, followed by manual dual annotation and a Hugging Face dataset.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a32"/><stop offset="0.58" stop-color="#172b49"/><stop offset="1" stop-color="#103d48"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b35a"/><stop offset="1" stop-color="#f0846b"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee0cb"/><stop offset="1" stop-color="#47a9d1"/></linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#b6d9e7" opacity="0.15"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06101f" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="2200" height="700" rx="26" fill="url(#bg)"/>
  <rect width="2200" height="700" rx="26" fill="url(#dots)"/>
  <circle cx="2100" cy="30" r="300" fill="#2e7c83" opacity="0.12"/>
  <circle cx="1230" cy="700" r="360" fill="#f0b35a" opacity="0.045"/>
  <path d="M0 585 C260 525 390 650 650 600 S1040 520 1310 590 S1770 660 2200 535" stroke="#b6d9e7" stroke-width="2" opacity="0.10" fill="none"/>

  <g transform="translate(105 92)">
    <rect x="0" y="0" width="340" height="45" rx="22" fill="#f0b35a" opacity="0.16" stroke="#f0b35a" stroke-opacity="0.7"/>
    <circle cx="24" cy="22.5" r="5" fill="#f0b35a"/>
    <text x="43" y="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.4" fill="#f8d89f">ASSAMESE NLP · DATA COLLECTION</text>
    <text x="0" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-1.8" fill="#f5f8ff">ASSAMESE DATASET</text>
    <text x="0" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-1.8" fill="#f5f8ff">COLLECTION SCRIPTS</text>
    <rect x="0" y="251" width="132" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#d1e1f0">Reference templates for gathering review text from</text>
    <text x="0" y="346" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#d1e1f0">IMDb, Reddit and YouTube.</text>
    <text x="0" y="405" font-family="Noto Sans Bengali, Noto Serif Bengali, sans-serif" font-size="31" font-weight="600" fill="#65dfcd">অসমীয়া ভাষাৰ বাবে তথ্য সংগ্ৰহ</text>
    <g transform="translate(0 458)">
      <rect x="0" y="0" width="105" height="40" rx="20" fill="#203c5b" stroke="#7099b8" stroke-opacity="0.45"/>
      <text x="52.5" y="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#dbeaff">Python</text>
      <rect x="118" y="0" width="91" height="40" rx="20" fill="#203c5b" stroke="#7099b8" stroke-opacity="0.45"/>
      <text x="163.5" y="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#dbeaff">CSV</text>
      <rect x="222" y="0" width="130" height="40" rx="20" fill="#203c5b" stroke="#7099b8" stroke-opacity="0.45"/>
      <text x="287" y="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#dbeaff">API templates</text>
    </g>
    <text x="0" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.1" fill="#a9bed0">REFERENCE IMPLEMENTATIONS · NOT THE ORIGINAL HISTORICAL SCRIPTS</text>
  </g>

  <g transform="translate(1170 85)" filter="url(#shadow)">
    <rect x="0" y="0" width="925" height="530" rx="28" fill="#0b172a" fill-opacity="0.8" stroke="#8bbacb" stroke-opacity="0.28"/>
    <text x="42" y="53" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a8c8d9">CONCEPTUAL COLLECTION WORKFLOW</text>
    <text x="42" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#eff7ff">Three source adapters · One baseline CSV schema</text>

    <g transform="translate(42 124)">
      <rect x="0" y="0" width="238" height="72" rx="15" fill="#202d47" stroke="#e5a45e" stroke-opacity="0.75"/>
      <circle cx="32" cy="36" r="17" fill="#e5a45e"/>
      <text x="32" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" text-anchor="middle" fill="#18243a">i</text>
      <text x="61" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">IMDb</text>
      <text x="61" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8cadb">Web page parsing</text>
      <rect x="0" y="90" width="238" height="72" rx="15" fill="#202d47" stroke="#6d9eff" stroke-opacity="0.75"/>
      <circle cx="32" cy="126" r="17" fill="#ff6e80"/>
      <text x="32" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" text-anchor="middle" fill="#ffffff">r</text>
      <text x="61" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Reddit</text>
      <text x="61" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8cadb">PRAW · API access</text>
      <rect x="0" y="180" width="238" height="72" rx="15" fill="#202d47" stroke="#5ee0cb" stroke-opacity="0.75"/>
      <circle cx="32" cy="216" r="17" fill="#ed5454"/>
      <path d="M26 207 L26 225 L41 216 Z" fill="#ffffff"/>
      <text x="61" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">YouTube</text>
      <text x="61" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8cadb">Data API v3</text>
    </g>

    <path d="M295 160 H335 V250 H365" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <path d="M295 250 H365" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M295 340 H335 V250 H365" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <path d="M355 242 L365 250 L355 258" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <g transform="translate(372 208)">
      <rect x="0" y="0" width="180" height="84" rx="17" fill="#193f52" stroke="#58cdbf" stroke-width="1.5"/>
      <path d="M22 24 H58 M22 38 H58 M22 52 H49" stroke="#66dbc8" stroke-width="4" stroke-linecap="round"/>
      <text x="78" y="35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#effbff">Raw CSV</text>
      <text x="78" y="57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#b8e0e5">ID · Reviews · Sentiment</text>
    </g>
    <path d="M552 250 H596" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M586 242 L596 250 L586 258" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(605 208)">
      <rect x="0" y="0" width="270" height="84" rx="17" fill="#2b354c" stroke="#e5a45e" stroke-width="1.5"/>
      <circle cx="35" cy="42" r="18" fill="#e5a45e" opacity="0.95"/>
      <path d="M26 42 L32 48 L44 34" stroke="#1b2c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="65" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff4e4">Manual dual</text>
      <text x="65" y="57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff4e4">annotation</text>
    </g>
    <path d="M740 292 V342" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M732 332 L740 342 L748 332" stroke="#72d9d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(605 352)">
      <rect x="0" y="0" width="270" height="96" rx="18" fill="#183d3f" stroke="#58cdbf" stroke-width="1.5"/>
      <path d="M25 30 L43 21 L61 30 L61 52 L43 61 L25 52 Z" fill="none" stroke="#63e0cb" stroke-width="2.5"/>
      <circle cx="43" cy="41" r="7" fill="#63e0cb"/>
      <text x="80" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#effffb">Hugging Face</text>
      <text x="80" y="61" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#effffb">dataset</text>
      <text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#b3e6df">Published resource</text>
    </g>
    <text x="42" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#92a9bd">Illustrative overview only; this repository provides reference collection scripts.</text>
  </g>
</svg>
